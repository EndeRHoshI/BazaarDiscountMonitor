name: The Bazaar Discount Monitor

on:
  workflow_dispatch:
    # 允许手动或通过外部接口（cron-job.org）触发时选择模式
    inputs:
      run_type:
        description: '请选择运行类型 (monitor=仅监控不打扰, daily=强制发送日报)'
        required: true
        default: 'monitor'
        type: choice
        options:
          - monitor
          - daily

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许提交代码回仓库以保存 discount_status.json 状态文件
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          # 外部触发时，根据传入的 run_type 参数决定是否发送日报
          if [ "${{ github.event.inputs.run_type }}" = "daily" ]; then
            echo "触发总结日报推送..."
            python monitor.py --daily
          else
            echo "触发每小时折扣监控..."
            python monitor.py
          fi

      - name: Commit and push changes to status file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 检查 discount_status.json 是否有变化，若有则提交保存
          git add discount_status.json
          git diff-index --quiet HEAD || (git commit -m "Auto-update discount status [skip ci]" && git push)
