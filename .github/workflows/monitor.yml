name: The Bazaar Discount Monitor

on:
  schedule:
    # 每一个小时执行一次价格监控 (UTC 时间整点，如 00:00, 01:00 = 北京时间 08:00, 09:00)
    - cron: '0 * * * *'
    # 每天北京时间 23:30 执行一次日报推送 (北京时间 23:30 = UTC 时间 15:30)
    - cron: '30 15 * * *'
  workflow_dispatch:
    # 允许手动在 GitHub 页面点击触发运行时选择模式，避免无谓消耗 Server酱 额度
    inputs:
      run_type:
        description: '请选择运行类型 (monitor=仅监控不打扰, daily=强制发送日报)'
        required: true
        default: 'monitor'
        type: choice
        options:
          - monitor
          - daily

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许提交代码回仓库以保存 discount_status.json 状态文件
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          # 满足以下任一条件时，触发发送日报：
          # 1. 触发源是定时任务且表达式为每天 23:30 (15:30 UTC)
          # 2. 手动触发时，用户在下拉菜单中选择了 'daily'
          if [ "${{ github.event.schedule }}" = "30 15 * * *" ] || [ "${{ github.event.inputs.run_type }}" = "daily" ]; then
            echo "触发总结日报推送..."
            python monitor.py --daily
          else
            echo "触发每小时折扣监控..."
            python monitor.py
          fi

      - name: Commit and push changes to status file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 检查 discount_status.json 是否有变化，若有则提交保存
          git add discount_status.json
          git diff-index --quiet HEAD || (git commit -m "Auto-update discount status [skip ci]" && git push)
